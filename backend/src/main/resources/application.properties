# ═══════════════════════════════════════════
# KrishiMandi AI — Application Configuration
# ═══════════════════════════════════════════

spring.application.name=krishimandi-backend
server.port=8080

# ─── MongoDB ───────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/krishimandi}
spring.data.mongodb.database=krishimandi

# ─── JWT ────────────────────────────────────
app.jwt.secret=${JWT_SECRET:KrishiMandiSecretKey2024SuperSecure!@#$%ABCDEF1234567890}
app.jwt.expiration-ms=86400000

# ─── ML Microservice ────────────────────────
app.ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
app.ml.service.timeout-ms=30000

# ─── Weather API ────────────────────────────
app.weather.api.key=${OPENWEATHER_API_KEY:your_openweather_api_key}
app.weather.api.url=https://api.openweathermap.org/data/2.5

# ─── Cache ──────────────────────────────────
spring.cache.type=simple
app.cache.prediction-ttl-minutes=60

# ─── CORS ───────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# ─── Logging ────────────────────────────────
logging.level.com.krishimandi=DEBUG
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Actuator ───────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
